name: UEA Runtime Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} — lint, types, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install ruff mypy pytest-timeout

      - name: Lint
        run: ruff check core adapters tests scripts

      - name: Type check
        run: mypy --strict core adapters

      - name: Runtime verification
        run: pytest --timeout=30 tests/ -v

  package:
    name: Package integrity
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify installed package
        run: |
          python -c "import core; assert core.__version__ == '0.1.0'; print(f'UEA {core.__version__}')"

      - name: Run repository verification
        run: python scripts/verify_all.py
