name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify installed package
        run: |
          python -c "import core; assert core.__version__ == '0.1.0'; print(f'Universal Engineering Augmentation {core.__version__}')"

      - name: Run verification suite
        run: python scripts/verify_all.py

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Check for secrets
        run: |
          ! grep -rn "api_key\|secret\|password\|token" core/ --include="*.py" -i | grep -v "# \|\"\"\|\'\'\|_token\|auth_token\|csrf"

      - name: Check for private paths
        run: |
          ! grep -rn "C:\\Users\|C:/Users\|/home/\|kio\|KIO" core/ tests/ scripts/ --include="*.py" -i
