[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-engineering-augmentation"
version = "0.1.0"
description = "Deterministic and specialized engineering capabilities for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "aspire488" }]
keywords = ["coding-agents", "software-engineering", "developer-tools", "static-analysis", "verification", "llm", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-json==0.24.8",
  "hypothesis==6.167.1",
  "z3-solver==5.1.0.0",
  "duckdb==1.5.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "duckdb.*", "z3.*"]
ignore_missing_imports = true

[project.scripts]
uea-verify = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
